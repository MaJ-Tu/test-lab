name: Docker Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f Dockerfile
          test -f index.html
          echo "Project files found"

      - name: Build Docker image
        run: |
          docker build -t devops-web:${{ github.sha }} .
